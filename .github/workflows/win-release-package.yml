name: Windows Release Package

# Auto-builds the Windows source-only zip whenever a release tag is pushed,
# and uploads it (plus the sha256 sidecar) to the matching GitHub release.
# Replaces the manual Edwin-on-Windows workflow that produced v0.12 - v0.21.1
# Windows zips.
#
# This job validates artifact shape only: the runner has no UE installation and
# does not run UBT. For v0.35, real Windows UE 5.7 and UE 5.8 UBT plus clean-
# project endpoint/MCP SDK conformance smoke must pass before the tag is pushed.
#
# Manual trigger via workflow_dispatch is also supported for release re-runs,
# back-filling Windows zips, or artifact-only candidates from an exact branch
# SHA. Artifact discovery accepts the engine suffix emitted by the selected
# revision's own packager.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.35.0) to (re-)package. Leave blank to package the selected workflow ref as an artifact-only candidate.'
        required: false
        default: ''

permissions:
  contents: write  # for gh release upload --clobber

jobs:
  package:
    name: Package Windows source-only zip
    runs-on: windows-2022

    steps:
      - name: Resolve checkout target
        id: target
        shell: pwsh
        run: |
          $eventName = [string]$env:GITHUB_EVENT_NAME
          $dispatchTag = ([string]$env:DISPATCH_TAG).Trim()
          $tag = ""

          if ($eventName -eq "push") {
            if ($env:GITHUB_REF -notlike "refs/tags/*") {
              throw "Push trigger is not a tag ref: $env:GITHUB_REF"
            }
            $tag = $env:GITHUB_REF -replace "^refs/tags/", ""
          } elseif ($eventName -eq "workflow_dispatch") {
            if (-not [string]::IsNullOrWhiteSpace($dispatchTag)) {
              $tag = $dispatchTag
            }
          } else {
            throw "Unsupported event: $eventName"
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            $checkoutRef = [string]$env:GITHUB_SHA
            Write-Host "Candidate mode: checkout exact workflow SHA $checkoutRef"
          } else {
            $checkoutRef = $tag
            Write-Host "Release mode: checkout tag $tag"
          }

          if ([string]::IsNullOrWhiteSpace($checkoutRef)) {
            throw "Resolved checkout ref is empty."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checkout_ref=$checkoutRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        env:
          DISPATCH_TAG: ${{ inputs.tag }}

      - name: Checkout target revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}
          fetch-depth: 1
          lfs: false

      - name: Resolve and validate package version
        id: version
        shell: pwsh
        run: |
          $descriptorPath = "Plugins/UnrealMcp/UnrealMcp.uplugin"
          $descriptor = Get-Content -LiteralPath $descriptorPath -Raw | ConvertFrom-Json
          $version = [string]$descriptor.VersionName

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "UnrealMcp.uplugin has no VersionName."
          }

          $tag = [string]$env:TARGET_TAG
          if (-not [string]::IsNullOrWhiteSpace($tag)) {
            $tagVersion = $tag -replace "^v", ""
            if ($tagVersion -ne $version) {
              throw "Tag '$tag' does not match UnrealMcp.uplugin VersionName '$version'."
            }
          }

          Write-Host "Package version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        env:
          TARGET_TAG: ${{ steps.target.outputs.tag }}

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          # Best-effort registry tweak — runner already has Developer Mode in most
          # images, but this guarantees the LongPathsEnabled bit for this job.
          try {
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          } catch {
            Write-Host "::warning::LongPathsEnabled could not be set; continuing (most jobs do not need it)."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pre-package source validators
        shell: pwsh
        run: |
          python Tools/validate_tool_registry.py
          if ($LASTEXITCODE -ne 0) { throw "validate_tool_registry.py failed" }
          python Tools/check_ue56_compat.py
          if ($LASTEXITCODE -ne 0) { throw "check_ue56_compat.py failed" }
          # This historically named validator protects the UE 5.6 maintenance
          # floor and compat-shim discipline; it is not a primary-engine build.
          # Skip verify_package_integrity --root in pre-package: it requires
          # Tools/UnrealMcpToolScaffolds/<id>/... working-copy paths that a
          # clean CI checkout doesn't have (gitignored). The packager itself
          # falls back to UnrealMcpToolScaffoldStarters; the post-package
          # --zip check below is the canonical verification.

      - name: Run package_plugin.ps1
        id: package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:PACKAGE_VERSION
          pwsh -File Tools/package_plugin.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { throw "package_plugin.ps1 failed" }
          $packageDir = "Saved/UnrealMcp/Packages"
          $zipCandidates = @(Get-ChildItem -LiteralPath $packageDir -Filter "UnrealMcp-v$version-win-*-projectroot.zip" -File)
          if ($zipCandidates.Count -ne 1) {
            throw "Expected exactly one Windows source zip in $packageDir, found $($zipCandidates.Count)."
          }
          $zipPath = $zipCandidates[0].FullName
          $shaPath = "$zipPath.sha256"
          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Expected zip not found: $zipPath"
          }
          if (-not (Test-Path -LiteralPath $shaPath)) {
            throw "Expected sha256 sidecar not found: $shaPath"
          }
          $zipFull = (Resolve-Path -LiteralPath $zipPath).Path
          $shaFull = (Resolve-Path -LiteralPath $shaPath).Path
          "zip_path=$zipFull" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha_path=$shaFull" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Produced: $zipFull"
          Get-Content -LiteralPath $shaFull

      - name: Verify produced zip
        shell: pwsh
        run: |
          python Tools/verify_package_integrity.py --zip "${{ steps.package.outputs.zip_path }}" --mode source --repo-root . --strict
          if ($LASTEXITCODE -ne 0) { throw "verify_package_integrity --zip failed" }

      - name: Upload as workflow artifact
        # Always upload so we can inspect even if the release upload step
        # fails (e.g. release doesn't exist yet for a fresh tag).
        uses: actions/upload-artifact@v4
        with:
          name: UnrealMcp-v${{ steps.version.outputs.version }}-win-zip
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.sha_path }}
          retention-days: 30

      - name: Attach to GitHub release (best-effort)
        if: steps.target.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
        run: |
          $tag = $env:TARGET_TAG
          $zip = "${{ steps.package.outputs.zip_path }}"
          $sha = "${{ steps.package.outputs.sha_path }}"

          # Verify release exists; if not, the workflow artifact above still
          # carries the zip for manual attachment.
          $releaseInfo = gh release view $tag --repo ${{ github.repository }} 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Release $tag not found yet — skipping upload. The zip is available as a workflow artifact for manual attachment."
            exit 0
          }

          gh release upload $tag $zip $sha --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          Write-Host "Uploaded $zip and $sha to release $tag"
